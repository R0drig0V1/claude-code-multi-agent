# Dependabot version updates. The actions of .github/workflows/ are pinned by commit SHA;
# Dependabot updates the SHA and its version comment. Minor and patch updates are grouped, and
# `cooldown` skips releases younger than seven days, a buffer against a compromised or yanked
# release. Dependabot reads this file only from the default branch.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
